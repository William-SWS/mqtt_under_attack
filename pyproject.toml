[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mqtt_under_attack"
version = "0.0.1"
description = "ML pipeline for detecting DoS attacks in MQTT networks"
authors = [
  { name = "William-SWS" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
requires-python = "==3.13.9"

# No [project.dependencies] here on purpose: install with
# `make requirements` / `pip install -r requirements.txt` (root pipeline) or
# `pip install -r api_inference/requirements.txt` (inference API, separate env).

[tool.ruff]
line-length = 99
src = ["scripts", "paretto", "notebooks_refactored"]
include = [
    "pyproject.toml",
    "main.py",
    "scripts/**/*.py",
    "paretto/**/*.py",
    "notebooks_refactored/**/*.py",
]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
force-sort-within-sections = true

